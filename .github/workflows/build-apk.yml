name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Código ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 21 (exigido pelo capacitor.build.gradle) ─────────────────────
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ── 3. Android SDK 35 ────────────────────────────────────────────────────
      - name: Instalar Android SDK 35
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" 2>/dev/null || true

      # ── 4. Cache do Gradle ───────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 5. Permissão de execução no gradlew ──────────────────────────────────
      - name: Permissão gradlew
        run: chmod +x android/gradlew

      # ── 6. Build APK debug ───────────────────────────────────────────────────
      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 7. Upload do artefato ────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verano-sports-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
