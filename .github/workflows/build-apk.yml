name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Código ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js 22 + cache ────────────────────────────────────────────────
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 3. Dependências ──────────────────────────────────────────────────────
      - name: Instalar dependências
        run: npm ci

      # ── 4. Build do cliente (Vite) ───────────────────────────────────────────
      # NODE_ENV=production desativa plugins exclusivos do Replit (cartographer,
      # dev-banner) que não existem no ambiente GitHub Actions.
      - name: Build do web app (Vite)
        run: NODE_ENV=production npx vite build
        env:
          NODE_ENV: production

      # ── 5. Sincronizar com Android ───────────────────────────────────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── 6. Java 17 ───────────────────────────────────────────────────────────
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 7. Cache do Gradle ───────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 8. Permissão de execução no gradlew ──────────────────────────────────
      - name: Permissão gradlew
        run: chmod +x android/gradlew

      # ── 9. Build APK debug ───────────────────────────────────────────────────
      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 10. Upload do artefato ───────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verano-sports-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
