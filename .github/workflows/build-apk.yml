name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Android SDK 35
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # package-lock.json contém URLs do proxy interno do Replit (package-firewall.replit.local)
      # que não são acessíveis no GitHub Actions — ignorar o lockfile e instalar do zero
      - name: Instalar dependências Node
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Verificar Capacitor CLI
        run: node_modules/.bin/cap --version

      - name: Criar webDir dummy para o cap sync
        run: mkdir -p dist/public && echo "<html></html>" > dist/public/index.html

      - name: Cap sync Android
        run: node_modules/.bin/cap sync android

      - name: Permissão gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verano-sports-debug
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
