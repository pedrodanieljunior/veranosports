name: Build APK de Produção

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente do APK'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Configurar URL do servidor
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            sed -i 's|url:.*picard.replit.dev.*|url: "https://veranosports.replit.app",|' capacitor.config.ts
            sed -i 's/webContentsDebuggingEnabled: true/webContentsDebuggingEnabled: false/' capacitor.config.ts
            sed -i 's/allowMixedContent: true/allowMixedContent: false/' capacitor.config.ts
            echo "✅ Config: PRODUÇÃO (veranosports.replit.app)"
          else
            echo "✅ Config: DESENVOLVIMENTO (mantém URL atual)"
          fi
          cat capacitor.config.ts | grep -A3 "server:"

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verano-sports-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Resumo
        run: |
          APK_SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "## ✅ APK gerado com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- **Ambiente:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tamanho:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Download:** na aba Artifacts acima" >> $GITHUB_STEP_SUMMARY
