name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente do APK'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Android SDK 35
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # package-lock.json contém URLs do proxy interno do Replit que não funcionam no GitHub
      - name: Instalar dependências Node
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Configurar URL do servidor
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            node -e "
              const fs = require('fs');
              let cfg = fs.readFileSync('capacitor.config.ts', 'utf8');
              cfg = cfg.replace(/url:.*/, 'url: \"https://veranosports.replit.app\",');
              cfg = cfg.replace('webContentsDebuggingEnabled: true', 'webContentsDebuggingEnabled: false');
              cfg = cfg.replace('allowMixedContent: true', 'allowMixedContent: false');
              fs.writeFileSync('capacitor.config.ts', cfg);
            "
            echo "✅ Config: PRODUÇÃO (veranosports.replit.app)"
          else
            echo "✅ Config: DESENVOLVIMENTO"
          fi
          grep -A4 "server:" capacitor.config.ts

      - name: Verificar Capacitor CLI
        run: node_modules/.bin/cap --version

      - name: Criar webDir dummy para o cap sync
        run: mkdir -p dist/public && echo "<html></html>" > dist/public/index.html

      - name: Cap sync Android
        run: node_modules/.bin/cap sync android

      - name: Permissão gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verano-sports-${{ github.event.inputs.environment }}-build${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
