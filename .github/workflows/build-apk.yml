name: Build APK de Produção

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente do APK'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Configurar URL do servidor
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            node -e "
              const fs = require('fs');
              let cfg = fs.readFileSync('capacitor.config.ts', 'utf8');
              cfg = cfg.replace(/url:.*/, 'url: \"https://veranosports.replit.app\",');
              cfg = cfg.replace('webContentsDebuggingEnabled: true', 'webContentsDebuggingEnabled: false');
              cfg = cfg.replace('allowMixedContent: true', 'allowMixedContent: false');
              fs.writeFileSync('capacitor.config.ts', cfg);
            "
            echo "✅ Config: PRODUÇÃO (veranosports.replit.app)"
          else
            echo "✅ Config: DESENVOLVIMENTO"
          fi
          grep -A4 "server:" capacitor.config.ts

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verano-sports-${{ github.event.inputs.environment }}-build${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Resumo
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "## ✅ APK gerado" >> $GITHUB_STEP_SUMMARY
          echo "- **Ambiente:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tamanho:** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Download:** aba Artifacts acima" >> $GITHUB_STEP_SUMMARY
