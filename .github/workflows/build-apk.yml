name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Código ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js (necessário para instalar pacotes @capacitor/*) ───────────
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 3. Instalar dependências (inclui node_modules/@capacitor/android etc) ─
      - name: Instalar dependências npm
        run: npm ci

      # ── 4. Java 21 (exigido pelo capacitor.build.gradle) ─────────────────────
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ── 5. Android SDK 35 ────────────────────────────────────────────────────
      - name: Instalar Android SDK 35
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      # ── 6. Cache do Gradle ───────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 7. Permissão gradlew ─────────────────────────────────────────────────
      - name: Permissão gradlew
        run: chmod +x android/gradlew

      # ── 8. Build APK debug ───────────────────────────────────────────────────
      # Os web assets já estão em android/app/src/main/assets/public/ (commitados).
      # O npm ci instala os @capacitor/* libs que o Gradle precisa como subprojetos.
      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 9. Upload do artefato ────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verano-sports-debug
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
