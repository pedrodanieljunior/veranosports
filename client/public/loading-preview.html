<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #2d2d2d; margin: 0; font-family: sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(0.8,0,1,1); }
      50% { transform: translateY(-6px); animation-timing-function: cubic-bezier(0,0,0.2,1); }
    }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    .bounce-1 { animation: bounce 1s infinite; }
    .bounce-2 { animation: bounce 1s infinite 0.15s; }
    .bounce-3 { animation: bounce 1s infinite 0.3s; }
    .skeleton { background: rgba(255,255,255,0.1); border-radius: 4px; }
    .skeleton-round { background: rgba(255,255,255,0.1); border-radius: 50%; }
  </style>
</head>
<body>
  <!-- Header simulado -->
  <div style="background:#1a1a1a; padding: 12px 16px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #3a3a3a;">
    <div style="width:28px;height:28px;border-radius:50%;background:#f59e0b;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#1a1a1a;font-size:12px;">FW</div>
    <span style="color:white;font-weight:bold;font-size:15px;">FW Sports</span>
    <div style="margin-left:auto;width:24px;height:24px;background:rgba(255,255,255,0.1);border-radius:6px;"></div>
  </div>

  <!-- Área principal -->
  <div style="padding: 16px;">

    <!-- Título com bolinhas pulsando -->
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
      <div style="display:flex; gap:5px; align-items:center;">
        <div class="bounce-1" style="width:8px;height:8px;border-radius:50%;background:#f59e0b;"></div>
        <div class="bounce-2" style="width:8px;height:8px;border-radius:50%;background:#f59e0b;"></div>
        <div class="bounce-3" style="width:8px;height:8px;border-radius:50%;background:#f59e0b;"></div>
      </div>
      <span style="color:rgba(255,255,255,0.6); font-size:13px; font-weight:500;">Carregando jogos disponíveis...</span>
    </div>

    <!-- Cards skeleton -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">

      <!-- Card 1 -->
      <div class="animate-pulse" style="background:#4a4a4a;border:1px solid #5a5a5a;border-radius:8px;overflow:hidden;">
        <div style="background:#3d3d3d;padding:8px 12px;border-bottom:1px solid #5a5a5a;display:flex;align-items:center;justify-content:space-between;">
          <div class="skeleton" style="height:10px;width:60px;"></div>
          <div class="skeleton" style="height:10px;width:14px;"></div>
        </div>
        <div style="padding:10px;display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="skeleton-round" style="width:22px;height:22px;flex-shrink:0;"></div>
            <div class="skeleton" style="height:11px;width:80px;"></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="skeleton-round" style="width:22px;height:22px;flex-shrink:0;"></div>
            <div class="skeleton" style="height:11px;width:66px;"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:4px;">
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="animate-pulse" style="background:#4a4a4a;border:1px solid #5a5a5a;border-radius:8px;overflow:hidden;animation-delay:0.1s">
        <div style="background:#3d3d3d;padding:8px 12px;border-bottom:1px solid #5a5a5a;display:flex;align-items:center;justify-content:space-between;">
          <div class="skeleton" style="height:10px;width:50px;"></div>
          <div class="skeleton" style="height:10px;width:14px;"></div>
        </div>
        <div style="padding:10px;display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="skeleton-round" style="width:22px;height:22px;flex-shrink:0;"></div>
            <div class="skeleton" style="height:11px;width:70px;"></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="skeleton-round" style="width:22px;height:22px;flex-shrink:0;"></div>
            <div class="skeleton" style="height:11px;width:90px;"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:4px;">
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="animate-pulse" style="background:#4a4a4a;border:1px solid #5a5a5a;border-radius:8px;overflow:hidden;animation-delay:0.2s">
        <div style="background:#3d3d3d;padding:8px 12px;border-bottom:1px solid #5a5a5a;display:flex;align-items:center;justify-content:space-between;">
          <div class="skeleton" style="height:10px;width:65px;"></div>
          <div class="skeleton" style="height:10px;width:14px;"></div>
        </div>
        <div style="padding:10px;display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="skeleton-round" style="width:22px;height:22px;flex-shrink:0;"></div>
            <div class="skeleton" style="height:11px;width:88px;"></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="skeleton-round" style="width:22px;height:22px;flex-shrink:0;"></div>
            <div class="skeleton" style="height:11px;width:60px;"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:4px;">
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
          </div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="animate-pulse" style="background:#4a4a4a;border:1px solid #5a5a5a;border-radius:8px;overflow:hidden;animation-delay:0.3s">
        <div style="background:#3d3d3d;padding:8px 12px;border-bottom:1px solid #5a5a5a;display:flex;align-items:center;justify-content:space-between;">
          <div class="skeleton" style="height:10px;width:55px;"></div>
          <div class="skeleton" style="height:10px;width:14px;"></div>
        </div>
        <div style="padding:10px;display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="skeleton-round" style="width:22px;height:22px;flex-shrink:0;"></div>
            <div class="skeleton" style="height:11px;width:75px;"></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="skeleton-round" style="width:22px;height:22px;flex-shrink:0;"></div>
            <div class="skeleton" style="height:11px;width:82px;"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:4px;">
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
            <div class="skeleton" style="height:34px;border-radius:6px;"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Nav mobile simulada -->
  <div style="position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:1px solid #3a3a3a;padding:10px 20px;display:flex;justify-content:space-around;align-items:center;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
      <div style="width:20px;height:20px;background:rgba(255,255,255,0.15);border-radius:4px;"></div>
      <div style="width:28px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
      <div style="width:20px;height:20px;background:rgba(255,255,255,0.15);border-radius:4px;"></div>
      <div style="width:28px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
      <div style="width:20px;height:20px;background:rgba(255,255,255,0.15);border-radius:4px;"></div>
      <div style="width:28px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;"></div>
    </div>
  </div>
</body>
</html>
